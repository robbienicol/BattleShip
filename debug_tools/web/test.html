<!doctype html>
<html><head><meta charset="utf-8"><title>BattleShip Web Test</title>
<style>html,body{margin:0;height:100%;background:#000}canvas{width:100%;height:100%;display:block}#log{position:fixed;left:0;bottom:0;color:#0f0;font:12px monospace;max-height:40%;overflow:auto;white-space:pre}</style>
</head><body>
<canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>
<div id="log"></div>
<script>
// Local test harness only: loads the extracted assets next to this page into
// the game's virtual filesystem. Never deploy this directory.
const files = ["BattleShip.o2r", "f3d.o2r", "gamecontrollerdb.txt"]; // plus assets/** (add the files in build-web/assets)
const log = (t) => { const el = document.getElementById("log"); el.textContent += t + "\n"; el.scrollTop = 1e9; };
const bust = "?v=" + Date.now(); // never run a cached build
window.addEventListener("unhandledrejection", (e) => log("UNHANDLED: " + e.reason + "\n" + (e.reason && e.reason.stack)));
window.addEventListener("error", (e) => log("ERROR: " + e.message));
var Module = {
  locateFile: (path) => path + bust,
  canvas: document.getElementById("canvas"),
  print: log,
  printErr: log,
  preRun: [() => {
    // Surface errors thrown during a fiber switch (otherwise they leave the
    // fiber trampoline wedged and the game silently stops).
    const finish = Fibers.finishContextSwitch;
    Fibers.finishContextSwitch = function (fiber) {
      try { return finish.call(this, fiber); }
      catch (e) { log("FIBER SWITCH ERROR: " + e + "\n" + (e && e.stack)); console.error(e); throw e; }
    };
    // ?SSB64_SYNCTEST=7&SSB64_REPLAY_PLAY=/test.ssb64r&preload=test.ssb64r
    const q = new URLSearchParams(location.search);
    for (const [k, v] of q) {
      if (k.startsWith("SSB64_")) ENV[k] = v;
      if (k === "preload") files.push(...v.split(","));
    }
    // Rollback transport for the local pair test (pair.html): tabs/frames on
    // this origin exchange packets over a BroadcastChannel, with optional
    // simulated latency (lat, jit ms) and loss (loss %). The site uses WebRTC.
    if (q.get("net") === "bc") {
      const self = q.get("self"), lat = +q.get("lat") || 0, jit = +q.get("jit") || 0, loss = +q.get("loss") || 0;
      const bc = new BroadcastChannel("ssb64-net");
      const inbox = [];
      bc.onmessage = (e) => { if (e.data.to === self) inbox.push({ from: e.data.from, data: e.data.data }); };
      Module.ssbNet = {
        inbox,
        send(to, data) {
          if (loss && Math.random() * 100 < loss) return;
          const ms = lat + (jit ? (Math.random() * 2 - 1) * jit : 0);
          const msg = { to, from: self, data };
          if (ms <= 0) bc.postMessage(msg); else setTimeout(() => bc.postMessage(msg), ms);
        },
      };
    }
    for (const f of files) {
      const dir = f.includes("/") ? "/" + f.slice(0, f.lastIndexOf("/")) : "/";
      FS.mkdirTree(dir);
      FS.createPreloadedFile(dir, f.split("/").pop(), f, true, true);
    }
  }],
};
</script>
<script>document.write('<script src="BattleShip.js' + bust + '"><\/script>');</script>
</body></html>
